name: go
on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
      - run: CGO_ENABLED=0 GOOS=linux   GOARCH=amd64 go build ./cmd/...
      - run: CGO_ENABLED=0 GOOS=linux   GOARCH=arm64 go build ./cmd/...
      - run: CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build ./cmd/...
      - run: CGO_ENABLED=0 GOOS=windows GOARCH=386   go build ./cmd/...

  release:
    needs: [test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Build and package (linux amd64/arm64, windows amd64/386)
        env:
          CGO_ENABLED: "0"
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            out="dynafw-${VERSION}-linux-${arch}"
            mkdir -p "dist/${out}"
            GOOS=linux GOARCH="${arch}" go build -trimpath -ldflags='-s -w' -o "dist/${out}/dynafw" ./cmd/dynafw
            cp README.md LICENSE "dist/${out}/"
            tar -C dist -czf "dist/${out}.tar.gz" "${out}"
          done
          for arch in amd64 386; do
            out="dynafw-${VERSION}-windows-${arch}"
            mkdir -p "dist/${out}"
            GOOS=windows GOARCH="${arch}" go build -trimpath -ldflags='-s -w' -o "dist/${out}/dynafw.exe" ./cmd/dynafw
            cp README.md LICENSE "dist/${out}/"
            (cd dist && zip -r "${out}.zip" "${out}")
          done
          cd dist
          sha256sum *.tar.gz *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS.txt
          generate_release_notes: true
